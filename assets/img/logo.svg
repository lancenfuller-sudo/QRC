<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Flow Fund">
  <defs>
    <linearGradient id="ff-water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2BA8A0"/>
      <stop offset="100%" stop-color="#0B1F33"/>
    </linearGradient>
    <linearGradient id="ff-foam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2BA8A0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F4F7F8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Circular reservoir -->
  <circle cx="32" cy="32" r="29" fill="#0B1F33"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#C7A15A" stroke-width="1.25" opacity="0.85"/>
  <!-- Water fill in vessel -->
  <clipPath id="ff-bowl">
    <circle cx="32" cy="32" r="22"/>
  </clipPath>
  <g clip-path="url(#ff-bowl)">
    <rect x="8" y="28" width="48" height="30" fill="url(#ff-foam)"/>
    <!-- Single current -->
    <path d="M10 36c6-5 10-5 14 0s10 5 14 0 10-5 14 0" fill="none" stroke="#F4F7F8" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    <path d="M10 42c6-4 10-4 14 0s10 4 14 0 10-4 14 0" fill="none" stroke="#2BA8A0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Gold rim highlight -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#C7A15A" stroke-width="0.75" opacity="0.4"/>
</svg>
